<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8">
  <title>ONLINE TV – Live & Movies</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #0b0b0b;
      color: #fff;
    }
    header {
      background: #111;
      padding: 15px;
      text-align: center;
      font-size: 22px;
      font-weight: bold;
      color: #00ffd5;
    }
    nav {
      display: flex;
      overflow-x: auto;
      background: #1a1a1a;
    }
    nav button {
      flex: none;
      background: none;
      border: none;
      color: #fff;
      padding: 12px 16px;
      cursor: pointer;
      font-size: 14px;
    }
    nav button:hover {
      background: #00ffd5;
      color: #000;
    }
    .container {
      padding: 15px;
    }
    h2 {
      border-bottom: 1px solid #333;
      padding-bottom: 5px;
      color: #00ffd5;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 12px;
    }
    .card {
      background: #1c1c1c;
      padding: 10px;
      text-align: center;
      border-radius: 6px;
      cursor: pointer;
    }
    .card:hover {
      background: #2a2a2a;
    }
    .player {
      margin-top: 15px;
    }
    video, iframe {
      width: 100%;
      height: 220px;
      background: #000;
    }
    footer {
      text-align: center;
      padding: 10px;
      font-size: 12px;
      color: #aaa;
    }
  </style>
</head>
<body>

<header>📺 ONLINE TV – Live • Movies • Series</header>

<nav>
  <button onclick="show('live')">Live TV</button>
  <button onclick="show('sports')">Sports</button>
  <button onclick="show('kids')">Kids</button>
  <button onclick="show('movies')">Movies & Series</button>
  <button onclick="show('music')">Music</button>
  <button onclick="show('docs')">Documentary</button>
</nav>

<div class="container">

  <div id="live" class="section">
    <h2>🔴 Live TV</h2>
    <div class="grid">
      <div class="card" onclick="play('https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8')">Live Channel 1</div>
      <div class="card" onclick="play('https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8')">Live Channel 2</div>
    </div>
  </div>

  <div id="sports" class="section" style="display:none">
    <h2>⚽ Sports</h2>
    <div class="grid">
      <div class="card" onclick="play('https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8')">Sports Live</div>
    </div>
  </div>

  <div id="kids" class="section" style="display:none">
    <h2>🧒 Kids</h2>
    <div class="grid">
      <div class="card" onclick="play('https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8')">Kids TV</div>
    </div>
  </div>

  <div id="movies" class="section" style="display:none">
    <h2>🎬 Movies & Series</h2>
    <div class="grid">
      <div class="card" onclick="playVideo()">Movie Sample</div>
    </div>
  </div>

  <div id="music" class="section" style="display:none">
    <h2>🎵 Music</h2>
    <div class="grid">
      <div class="card" onclick="play('https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8')">Music Live</div>
    </div>
  </div>

  <div id="docs" class="section" style="display:none">
    <h2>🌍 Documentary</h2>
    <div class="grid">
      <div class="card" onclick="play('https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8')">Nature Doc</div>
    </div>
  </div>

  <div class="player" id="player"></div>

</div>

<footer>
  © 2025 ONLINE TV | Built by Mjomba Gibson
</footer>

<script>
  function show(id) {
    document.querySelectorAll('.section').forEach(s => s.style.display = 'none');
    document.getElementById(id).style.display = 'block';
  }

  function play(url) {
    document.getElementById('player').innerHTML =
      `<video controls autoplay src="${url}"></video>`;
  }

  function playVideo() {
    document.getElementById('player').innerHTML =
      `<video controls autoplay>
        <source src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4" type="video/mp4">
      </video>`;
  }
</script>

</body>
</html>
