<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8" />
  <title>ONLINE TV – Live & Movies</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #0b0b0b;
      color: #fff;
    }

    header {
      background: #111;
      padding: 14px;
      text-align: center;
      font-size: 22px;
      font-weight: bold;
      color: #00ffd5;
    }

    /* VIDEO PLAYER */
    .player {
      position: relative;
      background: #000;
    }

    video {
      width: 100%;
      height: auto;
      background: #000;
    }

    .live-badge {
      position: absolute;
      top: 10px;
      left: 10px;
      background: red;
      padding: 4px 8px;
      font-size: 12px;
      border-radius: 4px;
    }

    /* CATEGORY BAR */
    .categories {
      display: flex;
      overflow-x: auto;
      background: #1a1a1a;
      padding: 8px;
      gap: 8px;
    }

    .categories button {
      background: #222;
      color: #fff;
      border: none;
      padding: 8px 14px;
      border-radius: 20px;
      white-space: nowrap;
      cursor: pointer;
    }

    .categories button.active {
      background: #00ffd5;
      color: #000;
      font-weight: bold;
    }

    /* CHANNEL LIST */
    .channel-list {
      padding: 10px;
    }

    .channel {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #151515;
      padding: 10px;
      margin-bottom: 8px;
      border-radius: 8px;
      cursor: pointer;
    }

    .channel-info {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .channel-logo {
      width: 42px;
      height: 42px;
      background: #333;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
    }

    .channel-name {
      font-size: 14px;
      font-weight: bold;
    }

    .channel-status {
      font-size: 12px;
      color: #00ffd5;
    }

    /* EPG */
    .epg {
      background: #101010;
      padding: 10px;
      border-top: 1px solid #222;
    }

    .epg-title {
      font-weight: bold;
      margin-bottom: 8px;
    }

    .epg-item {
      background: #181818;
      padding: 8px;
      border-radius: 6px;
      margin-bottom: 6px;
      font-size: 13px;
    }

    footer {
      text-align: center;
      padding: 10px;
      font-size: 12px;
      color: #888;
    }
  </style>
</head>

<body>

<header>📺 ONLINE TV – TV ON THE GO</header>

<!-- PLAYER -->
<div class="player">
  <span class="live-badge">LIVE</span>
  <video id="videoPlayer" controls autoplay>
    <source src="https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8" type="application/x-mpegURL">
    Browser yako hai-support video.
  </video>
</div>

<!-- CATEGORIES -->
<div class="categories">
  <button class="active">Sports</button>
  <button>Movies</button>
  <button>Kids</button>
  <button>Music</button>
  <button>Documentary</button>
  <button>Telenovela</button>
</div>

<!-- CHANNEL LIST -->
<div class="channel-list">

  <div class="channel" onclick="playChannel('https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8')">
    <div class="channel-info">
      <div class="channel-logo">SPORT</div>
      <div>
        <div class="channel-name">Live Sports (4K)</div>
        <div class="channel-status">Watching</div>
      </div>
    </div>
    ❤️
  </div>

  <div class="channel" onclick="playChannel('https://bitdash-a.akamaihd.net/content/sintel/hls/playlist.m3u8')">
    <div class="channel-info">
      <div class="channel-logo">MOV</div>
      <div>
        <div class="channel-name">Movie Channel HD</div>
        <div class="channel-status">Live</div>
      </div>
    </div>
    ❤️
  </div>

  <div class="channel">
    <div class="channel-info">
      <div class="channel-logo">KIDS</div>
      <div>
        <div class="channel-name">Kids TV</div>
        <div class="channel-status">Live</div>
      </div>
    </div>
    ❤️
  </div>

</div>

<!-- EPG -->
<div class="epg">
  <div class="epg-title">📅 EPG – Today</div>

  <div class="epg-item">05:00 – 06:30 | Fit Morning</div>
  <div class="epg-item">06:30 – 08:00 | Football Highlights</div>
  <div class="epg-item">08:00 – 11:00 | Live Match 🔴</div>
  <div class="epg-item">11:00 – 13:00 | Sports Today</div>
</div>

<footer>
  © 2025 ONLINE TV | Live Streaming
</footer>

<script>
  function playChannel(url) {
    const player = document.getElementById("videoPlayer");
    player.src = url;
    player.play();
  }
</script>

</body>
  </html>
